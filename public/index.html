<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync | Watch Together</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <!-- Use high-end typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">SYNC.</div>
            <div class="room-info">
                <div style="display: flex; gap: 6px; align-items: center; margin-right: 8px;">
                    Room <span id="roomNameDisplay">...</span>
                </div>
                <div id="participantAvatars" class="avatar-stack"></div>
            </div>
            <div class="header-controls">
                <button class="action-btn share-btn magnetic" id="shareScreenBtn">
                    <span class="btn-content">Share Screen</span>
                </button>
                <button class="join-btn magnetic" id="copyInviteBtn" onclick="copyInviteLink()">
                    <span class="btn-content">Copy Invite</span>
                </button>
                <button class="join-btn magnetic" onclick="joinNewRoom()">
                    <span class="btn-content">Switch Room</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Video Section -->
            <div class="video-container">
                <!-- Ambient Glow Canvas -->
                <canvas id="ambientGlow" class="ambient-glow"></canvas>
                
                <div class="video-wrapper">
                    <video id="syncVideo" playsinline poster="offline.jpg"></video>
                    <div id="laserContainer" class="laser-container"></div>
                    <div class="laser-hint">Hold SHIFT over video to use Laser Pointer</div>
                </div>

                <div class="video-controls-panel">
                    <div class="url-input-group" style="display: flex; gap: 12px; align-items: center; width: 100%;">
                        <input type="text" id="videoUrlInput" class="glow-input" placeholder="Paste direct .mp4 link..." style="flex: 1;">
                        <button class="magnetic load-btn" onclick="changeVideo()">
                            <span class="btn-content">Load</span>
                        </button>
                        <select id="qualitySelect" class="glow-input" style="padding: 12px 16px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;">
                            <option value="auto">Auto Quality</option>
                            <option value="1080p60" selected>1080p 60fps</option>
                            <option value="720p30">720p 30fps</option>
                            <option value="480p30">480p 30fps</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="chat-container">
                <div class="chat-header">
                    <h3>Live Chat</h3>
                    <div class="pulse-indicator"></div>
                </div>
                
                <!-- Sticker Panel (Hidden by default) -->
                <div class="sticker-panel hidden" id="stickerPanel">
                    <input type="text" id="gifSearchInput" class="glow-input" placeholder="Search Tenor GIFs..." style="width: 100%; margin-bottom: 12px;">
                    <div class="sticker-grid" id="stickerGrid">
                        <!-- Stickers injected via JS -->
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will appear here -->
                </div>
                <div id="typingIndicator" class="typing-indicator hidden"></div>
                <div class="reaction-bar" id="reactionBar">
                    <button class="reaction-btn" data-emoji="🔥">🔥</button>
                    <button class="reaction-btn" data-emoji="😂">😂</button>
                    <button class="reaction-btn" data-emoji="🤯">🤯</button>
                    <button class="reaction-btn" data-emoji="💀">💀</button>
                    <button class="reaction-btn" data-emoji="😭">😭</button>
                    <div class="separator"></div>
                    <button class="soundboard-btn" data-sound="vine-boom" title="Vine Boom">💥</button>
                    <button class="soundboard-btn" data-sound="bruh" title="Bruh">🤦</button>
                    <button class="soundboard-btn" data-sound="applause" title="Applause">👏</button>
                </div>
                <div class="chat-input-area">
                    <button id="toggleStickersBtn" class="magnetic action-btn" title="Stickers">
                        <span class="btn-content">😊</span>
                    </button>
                    <input type="text" id="chatInput" class="glow-input" placeholder="Type a message...">
                    <button id="sendChatBtn" class="magnetic send-btn">
                        <span class="btn-content">Send</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal" id="joinModal">
        <div class="modal-content">
            <h2>Enter the Void</h2>
            <p>Sync up and watch together seamlessly.</p>
            <div class="input-stack">
                <input type="text" id="roomInput" class="glow-input" placeholder="Room ID">
                <input type="text" id="usernameInput" class="glow-input" placeholder="Your Alias">
            </div>
            <button class="magnetic enter-btn" onclick="connectToRoom()">
                <span class="btn-content">Initialize Connection</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
